<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="TradingPro: I&T — Real-time Investing & Trading platform with advanced portfolio management, instant market tracking, and secure deposit and withdrawal workflows.">

  <!-- Theme Color for Mobile Browsers -->
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TradingPro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- High-Priority Preconnects for Faster Asset Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.binance.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TradingPro: I&T — Investing & Trading</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0E14;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      animation: fadeIn 0.4s ease-out forwards;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6366F1 0%, #4338CA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4), 0 8px 10px -6px rgba(99, 102, 241, 0.2);
      margin-bottom: 20px;
      position: relative;
    }
    .logo-badge svg {
      width: 42px;
      height: 42px;
      fill: #FFFFFF;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .brand-title span {
      color: #818CF8;
    }
    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }
    .loader-bar {
      width: 140px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, #6366F1, #A855F7);
      border-radius: 999px;
      animation: loadingAnim 1.4s ease-in-out infinite;
    }
    @keyframes loadingAnim {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <!-- Instant Lightweight HTML/CSS Splash -->
  <div id="splash" class="splash-container">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="brand-title">Trading<span>Pro</span></div>
    <div class="brand-subtitle">Fast & Secure Digital Asset Trading</div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
