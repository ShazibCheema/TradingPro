name: tradingpro
description: TradingPro - I&T Investing & Trading Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.5
  firebase_app_check: ^0.3.1+4
  firebase_analytics: ^11.3.4
  cloud_functions: ^5.1.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.3

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0

  # QR Code
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.3
  package_info_plus: ^8.1.2
  clipboard: ^0.1.3
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/


flutter_launcher_icons:
  image_path: "assets/images/TradingPro-logo.png"
  android: true
  ios: true


